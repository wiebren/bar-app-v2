<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#211d18" />
		<script>
			// Before first paint: honour an explicit light/dark choice, so a dark
			// theme never flashes the cream background. 'auto' stores nothing and
			// falls through to the prefers-color-scheme rules in the root layout.
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				var dark =
					t === 'dark' ||
					(t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', dark ? '#16130f' : '#211d18');
			} catch (e) {
				// no storage (private mode) — the default light theme stands
			}
		</script>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
