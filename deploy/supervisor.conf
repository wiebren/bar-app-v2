# /etc/supervisor/conf.d/bar-app.conf
# Reload with: supervisorctl reread && supervisorctl update

[program:bar-app]
command=/home/zzv/bar-app-v2/pocketbase/pocketbase serve --http=127.0.0.1:8090
directory=/home/zzv/bar-app-v2/pocketbase
user=zzv
autostart=true
autorestart=true
stdout_logfile=/var/log/bar-app.log
stderr_logfile=/var/log/bar-app.err
