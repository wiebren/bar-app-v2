# bar-app v2 — nginx vhost
# PocketBase serves both the API and the SvelteKit build (pb_public/),
# so nginx only reverse-proxies. Start PocketBase bound to localhost:
#   ./pocketbase serve --http=127.0.0.1:8090

server {
        listen 80;
        listen [::]:80;
        server_name bar.zwolschezeeverkenners.nl;
        return 301 https://bar.zwolschezeeverkenners.nl$request_uri;
}

server {
        # "http2" as listen parameter: works on nginx < 1.25.1 (newer versions
        # log a deprecation warning and prefer the standalone "http2 on;")
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name bar.zwolschezeeverkenners.nl;

        ssl_certificate /etc/letsencrypt/live/bar.zwolschezeeverkenners.nl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bar.zwolschezeeverkenners.nl/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 10m;

        location / {
                # PocketBase realtime uses SSE: keep the connection open and unbuffered
                proxy_http_version 1.1;
                proxy_set_header Connection '';
                proxy_read_timeout 360s;
                proxy_buffering off;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_pass http://127.0.0.1:8090;
        }
}
